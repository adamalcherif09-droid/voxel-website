<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tints the phone browser's URL bar / status bar to match the canvas. -->
  <meta name="theme-color" content="#d5c4ba" />
  <title>Voxel — Custom 3D Printing</title>

  <!-- Browser tab icon -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Warm the connection to Google Fonts early, so the actual
     download starts sooner on a cold visit. (React/Babel are
     same-origin /vendor files now — no preconnect needed.) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- These control what shows up when this site's link is shared on
       WhatsApp, Instagram, iMessage, Facebook, etc: the logo photo,
       title, and description shown under the link.
       IMPORTANT: og:image and og:url below use the site's actual live
       address, hardcoded. These meta tags always work correctly for
       link previews even without any JavaScript running (they're in
       this plain HTML file, sent as-is by the server) — but if this
       site ever moves to a different address (a custom domain, or a
       different host), these two lines need updating to match, or
       the preview image/link will point at the old address. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Voxel" />
  <meta property="og:title" content="Voxel — Custom 3D Printing" />
  <meta property="og:description" content="Precision prints, made to order. Browse ready-to-print designs or send your own file." />
  <meta property="og:image" content="https://voxel-website.onrender.com/logo.png" />
  <meta property="og:url" content="https://voxel-website.onrender.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Voxel — Custom 3D Printing" />
  <meta name="twitter:description" content="Precision prints, made to order. Browse ready-to-print designs or send your own file." />
  <meta name="twitter:image" content="https://voxel-website.onrender.com/logo.png" />

  <!-- The whole site's layout (spacing, grids, rounded corners, etc.)
       is built with Tailwind CSS utility classes. These live in
       public/tailwind.css — a small pre-built static stylesheet
       generated from the class names used in this file and in js/
       (see tailwind.config.js + tailwind-input.css in the project
       root if it ever needs regenerating).
       History: Tailwind used to compile these styles in the browser
       at page-load time via a big script (first cdn.tailwindcss.com,
       then self-hosted as /js/tailwind.js). That runtime compiler
       crashed on some iPhone browsers, silently removing every layout
       rule and collapsing the mobile layout into a jumbled pile. A
       plain static CSS file has nothing to execute, so it works
       everywhere. Loaded after styles.css to keep the same cascade
       order the old runtime-injected styles had. -->
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body>
  <!-- One-time branded intro (per browser session): the VOXEL mark
       assembles layer-by-layer like a print, then lifts away. Pure
       CSS — it dismisses itself even if scripts fail, and a tiny
       inline check hides it instantly on repeat visits. -->
  <div id="voxel-intro" aria-hidden="true">
    <div class="voxel-intro-inner">
      <div class="voxel-intro-mark">
        <span class="intro-bar b1"></span>
        <span class="intro-bar b2"></span>
        <span class="intro-bar b3"></span>
      </div>
      <div class="voxel-intro-wordmark">
        <span>V</span><span>O</span><span>X</span><span>E</span><span>L</span>
      </div>
      <div class="voxel-intro-tagline">Custom&nbsp;3D&nbsp;Printing</div>
      <div class="voxel-intro-sweep"></div>
    </div>
  </div>
  <script>
    try {
      if (sessionStorage.getItem("voxel-intro-done")) {
        var introEl = document.getElementById("voxel-intro");
        if (introEl) introEl.classList.add("voxel-intro-skip");
      } else {
        sessionStorage.setItem("voxel-intro-done", "1");
      }
    } catch (e) { /* storage blocked — intro just plays once per visit */ }
  </script>
  <div id="root"></div>

  <!-- React is SELF-HOSTED from /vendor (exact pinned versions,
       downloaded into the repo) — the site loads zero third-party
       scripts, so a compromised CDN can never inject code into this
       page, and the CSP allows no script origins beyond 'self'. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>

  <!-- The app files below are PRE-COMPILED from JSX by compile-jsx.js
       (the exact same "react/classic" transform the old runtime-Babel
       pipeline performed), so the browser executes them directly —
       babel.min.js (2.9 MB!) and the per-visitor compile step are gone.
       Load order still matters: each file uses things defined in the
       ones before it, and defer preserves order while letting the
       browser download them in parallel. Bump ?v= whenever app code
       changes so repeat visitors get fresh files instantly (see README
       "Editing the app code"). -->
  <script src="/js/icons.compiled.js?v=1" defer></script>
  <script src="/js/helpers.compiled.js?v=1" defer></script>
  <script src="/js/components-common.compiled.js?v=1" defer></script>
  <script src="/js/components-customer.compiled.js?v=1" defer></script>
  <script src="/js/components-admin.compiled.js?v=1" defer></script>
  <script src="/js/app.compiled.js?v=1" defer></script>

  <script src="/js/motion.js?v=1" defer></script>
</body>
</html>
