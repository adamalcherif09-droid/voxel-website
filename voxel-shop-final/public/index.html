<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel — Custom 3D Printing</title>

  <!-- Browser tab icon -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- These control what shows up when this site's link is shared on
       WhatsApp, Instagram, iMessage, Facebook, etc: the logo photo,
       title, and description shown under the link.
       IMPORTANT: og:image and og:url below use the site's actual live
       address, hardcoded. These meta tags always work correctly for
       link previews even without any JavaScript running (they're in
       this plain HTML file, sent as-is by the server) — but if this
       site ever moves to a different address (a custom domain, or a
       different host), these two lines need updating to match, or
       the preview image/link will point at the old address. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Voxel" />
  <meta property="og:title" content="Voxel — Custom 3D Printing" />
  <meta property="og:description" content="Precision prints, made to order. Browse ready-to-print designs or send your own file." />
  <meta property="og:image" content="https://voxel-website.onrender.com/logo.png" />
  <meta property="og:url" content="https://voxel-website.onrender.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Voxel — Custom 3D Printing" />
  <meta name="twitter:description" content="Precision prints, made to order. Browse ready-to-print designs or send your own file." />
  <meta name="twitter:image" content="https://voxel-website.onrender.com/logo.png" />

  <!-- The whole site's layout (spacing, grids, rounded corners, etc.)
       is built with Tailwind CSS utility classes. This loads Tailwind
       directly in the browser and generates the matching styles on
       the fly — no separate build step needed. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React itself, loaded straight from a CDN — no npm install, no build step. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Lets the browser understand the JSX (the <LikeThis /> tags) in the
       files below, on the fly, without a separate build step. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    // Load order matters here: each file uses things defined in the
    // ones before it, so they're fetched and run one at a time, in
    // this exact order. "runtime: classic" matters too — it tells
    // Babel to turn <Tags /> into React.createElement(...) calls,
    // which matches how React is loaded above (as a plain script,
    // not as a module). Without it, the page would just stay blank.
    var files = [
      "/js/icons.js",
      "/js/helpers.js",
      "/js/components-common.js",
      "/js/components-customer.js",
      "/js/components-admin.js",
      "/js/app.js",
    ];

    function loadNext(i) {
      if (i >= files.length) return;
      fetch(files[i])
        .then(function (res) { return res.text(); })
        .then(function (code) {
          var transformed = Babel.transform(code, {
            presets: [["react", { runtime: "classic" }]],
            filename: files[i],
          }).code;
          (0, eval)(transformed);
          loadNext(i + 1);
        })
        .catch(function (err) {
          console.error("Failed to load " + files[i], err);
          document.getElementById("root").innerHTML =
            "<p style='padding:40px;font-family:sans-serif;color:#8c2e1e'>Something didn't load correctly (" +
            files[i] + "). Check the browser console for details.</p>";
        });
    }
    loadNext(0);
  </script>

  <script src="/js/motion.js" defer></script>
</body>
</html>
