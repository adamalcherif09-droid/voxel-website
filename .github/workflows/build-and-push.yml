name: Build and push slicer image

# Builds the Docker image on GitHub's own servers (more memory than
# Render's free build machine) and pushes it to GHCR (GitHub's free
# image registry). Render then just runs the finished image instead
# of building it itself.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'server.js'
      - 'package.json'
      - 'profiles/**'
      - 'scripts/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/voxel-slicer-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
